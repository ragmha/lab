name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - name: Refresh GitHub language statistics
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api graphql -f query='query { repository(owner: "ragmha", name: "lab") { languages(first: 100, orderBy: {field: SIZE, direction: DESC}) { edges { size node { name color } } } } }' --jq '.data.repository.languages.edges' > "$RUNNER_TEMP/languages.json"
          cp "$RUNNER_TEMP/languages.json" src/data/languages.json
      - run: bun run test
      - run: bun run build
      - run: bunx playwright install --with-deps chromium webkit
      - run: bun run test:browser
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    name: Deploy GitHub Pages
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy checked build
        id: deployment
        uses: actions/deploy-pages@v4
